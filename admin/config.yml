# Decap CMS – urednik stranice Instituta Sveti Ivan Zlatousti
# Prijava urednika: Netlify Identity + Git Gateway (vidi UPUTE.md).
backend:
  name: git-gateway
  branch: main

locale: hr
site_url: https://institut-zlatousti.hr   # PROMIJENITI na stvarnu domenu
display_url: https://institut-zlatousti.hr
logo_url: /img/znak.png

media_folder: uploads
public_folder: /uploads

collections:
  - name: sadrzaj
    label: Novosti, događanja, projekti, dokumenti…
    description: "Popisi koji se često mijenjaju. Polja s oznakom (EN) su engleska verzija i nisu obavezna: ako su prazna, na engleskoj verziji prikazuje se hrvatski tekst."
    files:
      - name: sve
        label: Svi popisi
        file: content/sadrzaj.json
        format: json
        fields:
          - label: Novosti
            name: news
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {label: Naslov, name: title, widget: string}
              - {label: Naslov (EN), name: title_en, widget: string, required: false}
              - {label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false}
              - {label: Kratki opis, name: description, widget: text}
              - {label: Kratki opis (EN), name: description_en, widget: text, required: false}
              - {label: Poveznica na cijelu vijest, name: url, widget: string, required: false, hint: "Puna adresa, npr. https://ika.hkm.hr/..."}

          - label: Događanja (uključujući Priča pored Griča)
            name: events
            widget: list
            summary: "{{fields.date}} · {{fields.category}} · {{fields.title}}"
            fields:
              - {label: Naziv, name: title, widget: string}
              - {label: Naziv (EN), name: title_en, widget: string, required: false}
              - {label: Vrsta, name: category, widget: select, required: false, options: ["Predavanje", "Konferencija", "Duhovni susret", "Priča pored Griča", "Nastava Studija", "Radionica", "Liturgija", "Svečanost", "Ostalo"], hint: "Večeri s vrstom „Priča pored Griča“ prikazuju se i na stranici Priče pored Griča."}
              - {label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false}
              - {label: "Do datuma (za višednevna događanja)", name: date_end, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false, required: false}
              - {label: Početak, name: time, widget: string, required: false, hint: "Npr. 18:00. Ostavite prazno za cjelodnevno događanje."}
              - {label: Završetak, name: end_time, widget: string, required: false, hint: "Npr. 20:00"}
              - {label: Mjesto, name: place, widget: string, required: false}
              - {label: Opis, name: description, widget: text, required: false}
              - {label: Opis (EN), name: description_en, widget: text, required: false}
              - {label: Poveznica, name: url, widget: string, required: false}

          - label: Institut i Studij u medijima
            name: media
            widget: list
            summary: "{{fields.year}} · {{fields.source}} · {{fields.title}}"
            fields:
              - {label: Naslov objave, name: title, widget: string}
              - {label: Godina, name: year, widget: string, hint: "Npr. 2026"}
              - {label: Izvor (medij), name: source, widget: string, hint: "Npr. IKA, Križevačka eparhija, Laudato"}
              - {label: Vrsta, name: category, widget: select, options: ["Novosti", "Upisi", "Suradnja", "Događanja", "Studij", "Video", "Registar"], default: "Novosti"}
              - {label: Kratki opis, name: description, widget: text, required: false}
              - {label: Kratki opis (EN), name: description_en, widget: text, required: false}
              - {label: Poveznica na objavu, name: url, widget: string, hint: "Puna adresa, npr. https://ika.hkm.hr/..."}

          - label: Projekti
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Naziv, name: title, widget: string}
              - {label: Naziv (EN), name: title_en, widget: string, required: false}
              - {label: Status, name: status, widget: select, options: ["U planu", "Projekt u razvoju", "U tijeku", "Završeno"], default: "U planu"}
              - {label: Slika, name: image, widget: image, required: false}
              - {label: Kratki opis, name: description, widget: text}
              - {label: Kratki opis (EN), name: description_en, widget: text, required: false}
              - {label: Detaljniji opis, name: details, widget: text, required: false, hint: "Naslov odjeljka počinje s ## , stavka popisa s - . Odlomke odvojite praznim retkom."}
              - {label: Detaljniji opis (EN), name: details_en, widget: text, required: false}
              - {label: Poveznica, name: url, widget: string, required: false}

          - label: Dokumenti
            name: documents
            widget: list
            summary: "{{fields.year}} · {{fields.category}} · {{fields.title}}"
            fields:
              - {label: Naziv dokumenta, name: title, widget: string}
              - {label: Naziv (EN), name: title_en, widget: string, required: false}
              - {label: Vrsta, name: category, widget: select, options: ["Statut", "Plan rada", "Izvješće", "Financijski dokument", "Studij", "Ostalo"], default: "Ostalo"}
              - {label: Godina, name: year, widget: string, required: false, pattern: ["^(\\d{4})?$", "Upišite godinu, npr. 2025"]}
              - {label: Datum objave, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false, required: false}
              - {label: Datoteka (PDF ili Word), name: file, widget: file, required: false, media_folder: "/uploads/dokumenti", public_folder: "/uploads/dokumenti"}
              - {label: Ili poveznica na dokument, name: url, widget: string, required: false}
              - {label: Kratki opis, name: description, widget: text, required: false}
              - {label: Kratki opis (EN), name: description_en, widget: text, required: false}

          - label: Vodstvo Instituta
            name: leaders
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - {label: Ime i prezime (s titulom), name: name, widget: string}
              - {label: Uloga, name: role, widget: string}
              - {label: Uloga (EN), name: role_en, widget: string, required: false}
              - {label: Fotografija, name: photo, widget: image, required: false}
              - {label: Kratki životopis, name: bio, widget: text, required: false}
              - {label: Kratki životopis (EN), name: bio_en, widget: text, required: false}
              - {label: E-pošta, name: email, widget: string, required: false}

          - label: Fotogalerija
            name: photos
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Fotografija, name: image, widget: image, hint: "JPEG, PNG ili WebP, najbolje do 1600 px širine."}
              - {label: Naslov, name: title, widget: string}
              - {label: Naslov (EN), name: title_en, widget: string, required: false}
              - {label: Opis slike za slijepe i slabovidne, name: alt, widget: string, required: false}
              - {label: Kratki opis, name: description, widget: text, required: false}
              - {label: Kratki opis (EN), name: description_en, widget: text, required: false}

          - label: Obavijesti Studija
            name: notices
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {label: Naslov, name: title, widget: string}
              - {label: Naslov (EN), name: title_en, widget: string, required: false}
              - {label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false}
              - {label: Tekst, name: description, widget: text}
              - {label: Tekst (EN), name: description_en, widget: text, required: false}
              - {label: Poveznica, name: url, widget: string, required: false}

          - label: Raspored Studija (kalendar nastave)
            name: schedule
            widget: list
            summary: "{{fields.date}} · {{fields.time}} · {{fields.title}}"
            hint: "Svaki termin pojavljuje se u kalendaru na stranici Studija. Za vikend nastavu upišite datum početka i završetka."
            fields:
              - {label: "Naziv (npr. kolegij ili vikend nastave)", name: title, widget: string}
              - {label: Naziv (EN), name: title_en, widget: string, required: false}
              - {label: Datum, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false}
              - {label: "Do datuma (za višednevnu nastavu)", name: date_end, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY.", time_format: false, required: false}
              - {label: Početak, name: time, widget: string, required: false, hint: "Npr. 9:00", pattern: ["^([01]?\\d|2[0-3])[:.][0-5]\\d$|^$", "Upišite vrijeme u obliku 9:00"]}
              - {label: Završetak, name: end_time, widget: string, required: false, hint: "Npr. 14:30", pattern: ["^([01]?\\d|2[0-3])[:.][0-5]\\d$|^$", "Upišite vrijeme u obliku 14:30"]}
              - {label: Mjesto, name: place, widget: string, required: false, default: "Grkokatoličko sjemenište, Zagreb"}
              - {label: "Opis (predavač, prostorija, napomena)", name: description, widget: text, required: false}
              - {label: Opis (EN), name: description_en, widget: text, required: false}
              - {label: Poveznica, name: url, widget: string, required: false}

          - label: Predavači Studija
            name: teachers
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Ime i prezime (s titulom), name: title, widget: string}
              - {label: Uloga ili kolegij, name: role, widget: string, required: false}
              - {label: Uloga ili kolegij (EN), name: role_en, widget: string, required: false}
              - {label: Kratki životopis, name: description, widget: text}
              - {label: Kratki životopis (EN), name: description_en, widget: text, required: false}
              - {label: Poveznica, name: url, widget: string, required: false}

          - label: Predmeti Studija (plan nastave)
            name: courses
            widget: list
            summary: "{{fields.year}}. godina · {{fields.title}}"
            fields:
              - {label: Godina studija, name: year, widget: select, options: [{label: "1. godina", value: "1"}, {label: "2. godina", value: "2"}, {label: "3. godina", value: "3"}]}
              - {label: Vrsta, name: type, widget: select, options: ["Predmet", "Praktikum", "Seminar"], default: "Predmet"}
              - {label: Naziv predmeta, name: title, widget: string}
              - {label: Naziv predmeta (EN), name: title_en, widget: string, required: false}
              - {label: Opis sadržaja, name: description, widget: text, required: false}
              - {label: Opis sadržaja (EN), name: description_en, widget: text, required: false}

          - label: Vodstvo Studija
            name: study_leaders
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - {label: Ime i prezime, name: name, widget: string}
              - {label: Uloga, name: role, widget: string}
              - {label: Uloga (EN), name: role_en, widget: string, required: false}

          - label: Društvene mreže
            name: social
            widget: object
            fields:
              - {label: Facebook, name: facebook, widget: string, required: false}
              - {label: Instagram, name: instagram, widget: string, required: false}

          - label: Tajništvo SIKD-a
            name: sikd
            widget: object
            hint: "Prikazuje se na stranici Studija i u kontaktu. Sve informacije o Studiju upućuju se Tajništvu."
            fields:
              - {label: E-pošta Tajništva, name: email, widget: string, required: false}
              - {label: Telefon, name: phone, widget: string, required: false}
              - {label: Adresa, name: address, widget: string, required: false}
              - {label: Uredovno vrijeme, name: hours, widget: string, required: false, hint: "Npr. pon - pet, 9:00 - 13:00"}
              - {label: Uredovno vrijeme (EN), name: hours_en, widget: string, required: false}
              - {label: Napomena, name: note, widget: string, required: false}
              - {label: Napomena (EN), name: note_en, widget: string, required: false}

  - name: tekstovi
    label: Tekstovi stranice (hrvatski)
    description: "Svi tekstovi stranice na hrvatskom, kontakt podaci i podaci za uplatu. Oblikovanje: *kurziv*, **podebljano**, [tekst poveznice](https://adresa). Novi red u polju postaje novi red na stranici. Prazno polje = izvorni tekst."
    files:
      - name: svi_tekstovi
        label: Svi tekstovi, kontakt i uplata
        file: content/tekstovi.json
        format: json
        fields:
          - label: "Sitni tekstovi sučelja"
            name: ui
            widget: object
            collapsed: true
            fields:
              - {label: "Preskoci", name: preskoci, widget: string, required: false}
              - {label: "Kopiraj", name: kopiraj, widget: string, required: false}
              - {label: "Ucitavam barkod", name: ucitavam_barkod, widget: string, required: false}
          - label: "Izbornik"
            name: nav
            widget: object
            collapsed: true
            fields:
              - {label: "Institut", name: institut, widget: string, required: false}
              - {label: "Pocetna", name: pocetna, widget: string, required: false}
              - {label: "O", name: o, widget: string, required: false}
              - {label: "Studij", name: studij, widget: string, required: false}
              - {label: "Projekti", name: projekti, widget: string, required: false}
              - {label: "Price", name: price, widget: string, required: false}
              - {label: "Novosti", name: novosti, widget: string, required: false}
              - {label: "Dokumenti", name: dokumenti, widget: string, required: false}
              - {label: "Donacije", name: donacije, widget: string, required: false}
              - {label: "Kontakt", name: kontakt, widget: string, required: false}
          - label: "1. Naslovnica"
            name: pocetna
            widget: object
            collapsed: true
            fields:
              - {label: "Mala oznaka iznad naslova", name: oznaka, widget: string, required: false}
              - {label: "Glavni naslov", name: naslov, widget: text, required: false}
              - {label: "Uvodni tekst", name: uvod, widget: text, required: false}
              - {label: "Prvi gumb", name: gumb1, widget: string, required: false}
              - {label: "Drugi gumb", name: gumb2, widget: string, required: false}
              - {label: "Natpis ispod križa", name: natpis, widget: string, required: false}
              - {label: "Broj1", name: broj1, widget: string, required: false}
              - {label: "Broj1 opis", name: broj1_opis, widget: string, required: false}
              - {label: "Broj2", name: broj2, widget: string, required: false}
              - {label: "Broj2 opis", name: broj2_opis, widget: string, required: false}
              - {label: "Broj3", name: broj3, widget: string, required: false}
              - {label: "Broj3 opis", name: broj3_opis, widget: string, required: false}
              - {label: "Natpis slike", name: natpis_slike, widget: string, required: false}
              - {label: "O oznaka", name: o_oznaka, widget: string, required: false}
              - {label: "O naslov", name: o_naslov, widget: text, required: false}
              - {label: "O tekst", name: o_tekst, widget: text, required: false}
              - {label: "Znacajka1", name: znacajka1, widget: string, required: false}
              - {label: "Znacajka1 tekst", name: znacajka1_tekst, widget: string, required: false}
              - {label: "Znacajka2", name: znacajka2, widget: string, required: false}
              - {label: "Znacajka2 tekst", name: znacajka2_tekst, widget: string, required: false}
              - {label: "Znacajka3", name: znacajka3, widget: string, required: false}
              - {label: "Znacajka3 tekst", name: znacajka3_tekst, widget: string, required: false}
              - {label: "O poveznica", name: o_poveznica, widget: string, required: false}
              - {label: "Djel oznaka", name: djel_oznaka, widget: string, required: false}
              - {label: "Djel naslov", name: djel_naslov, widget: text, required: false}
              - {label: "Djel opis", name: djel_opis, widget: text, required: false}
              - {label: "Kartica1", name: kartica1, widget: string, required: false}
              - {label: "Kartica1 tekst", name: kartica1_tekst, widget: text, required: false}
              - {label: "Kartica1 poveznica", name: kartica1_poveznica, widget: string, required: false}
              - {label: "Kartica2", name: kartica2, widget: string, required: false}
              - {label: "Kartica2 tekst", name: kartica2_tekst, widget: text, required: false}
              - {label: "Kartica2 poveznica", name: kartica2_poveznica, widget: string, required: false}
              - {label: "Kartica3", name: kartica3, widget: string, required: false}
              - {label: "Kartica3 tekst", name: kartica3_tekst, widget: text, required: false}
              - {label: "Kartica3 poveznica", name: kartica3_poveznica, widget: string, required: false}
              - {label: "Vijesti oznaka", name: vijesti_oznaka, widget: string, required: false}
              - {label: "Vijesti naslov", name: vijesti_naslov, widget: text, required: false}
              - {label: "Vijesti poveznica", name: vijesti_poveznica, widget: string, required: false}
              - {label: "Mreze oznaka", name: mreze_oznaka, widget: string, required: false}
              - {label: "Mreze naslov", name: mreze_naslov, widget: text, required: false}
              - {label: "Mreze opis", name: mreze_opis, widget: text, required: false}
              - {label: "Facebook opis", name: facebook_opis, widget: text, required: false}
              - {label: "Instagram opis", name: instagram_opis, widget: text, required: false}
          - label: "2. O Institutu"
            name: o
            widget: object
            collapsed: true
            fields:
              - {label: "Oznaka", name: oznaka, widget: string, required: false}
              - {label: "Naslov", name: naslov, widget: text, required: false}
              - {label: "Uvod", name: uvod, widget: text, required: false}
              - {label: "Povijest oznaka", name: povijest_oznaka, widget: string, required: false}
              - {label: "Povijest naslov", name: povijest_naslov, widget: text, required: false}
              - {label: "Povijest tekst", name: povijest_tekst, widget: text, required: false}
              - {label: "Crta1 godina", name: crta1_godina, widget: string, required: false}
              - {label: "Crta1", name: crta1, widget: string, required: false}
              - {label: "Crta2 godina", name: crta2_godina, widget: string, required: false}
              - {label: "Crta2", name: crta2, widget: string, required: false}
              - {label: "Crta3 godina", name: crta3_godina, widget: string, required: false}
              - {label: "Crta3", name: crta3, widget: string, required: false}
              - {label: "Misija oznaka", name: misija_oznaka, widget: string, required: false}
              - {label: "Misija naslov", name: misija_naslov, widget: string, required: false}
              - {label: "Misija tekst", name: misija_tekst, widget: text, required: false}
              - {label: "Vizija oznaka", name: vizija_oznaka, widget: string, required: false}
              - {label: "Vizija naslov", name: vizija_naslov, widget: string, required: false}
              - {label: "Vizija tekst", name: vizija_tekst, widget: text, required: false}
              - {label: "Zastitnik oznaka", name: zastitnik_oznaka, widget: string, required: false}
              - {label: "Zastitnik naslov", name: zastitnik_naslov, widget: string, required: false}
              - {label: "Zastitnik tekst", name: zastitnik_tekst, widget: text, required: false}
              - {label: "Vodstvo oznaka", name: vodstvo_oznaka, widget: string, required: false}
              - {label: "Vodstvo naslov", name: vodstvo_naslov, widget: text, required: false}
              - {label: "Vodstvo opis", name: vodstvo_opis, widget: text, required: false}
          - label: "3. Studij (SIKD)"
            name: studij
            widget: object
            collapsed: true
            fields:
              - {label: "Oznaka", name: oznaka, widget: string, required: false}
              - {label: "Naslov", name: naslov, widget: text, required: false}
              - {label: "Uvod", name: uvod, widget: text, required: false}
              - {label: "Gumb", name: gumb, widget: string, required: false}
              - {label: "Vodic", name: vodic, widget: string, required: false}
              - {label: "O oznaka", name: o_oznaka, widget: string, required: false}
              - {label: "O naslov", name: o_naslov, widget: text, required: false}
              - {label: "O tekst", name: o_tekst, widget: text, required: false}
              - {label: "Ukratko naslov", name: ukratko_naslov, widget: string, required: false}
              - {label: "Ukratko tekst", name: ukratko_tekst, widget: text, required: false}
              - {label: "Podatak1", name: podatak1, widget: string, required: false}
              - {label: "Podatak1 vrijednost", name: podatak1_vrijednost, widget: string, required: false}
              - {label: "Podatak2", name: podatak2, widget: string, required: false}
              - {label: "Podatak2 vrijednost", name: podatak2_vrijednost, widget: string, required: false}
              - {label: "Podatak3", name: podatak3, widget: string, required: false}
              - {label: "Podatak3 vrijednost", name: podatak3_vrijednost, widget: string, required: false}
              - {label: "Podatak6", name: podatak6, widget: string, required: false}
              - {label: "Podatak6 vrijednost", name: podatak6_vrijednost, widget: string, required: false}
              - {label: "Podatak4", name: podatak4, widget: string, required: false}
              - {label: "Podatak4 vrijednost", name: podatak4_vrijednost, widget: string, required: false}
              - {label: "Podatak5", name: podatak5, widget: string, required: false}
              - {label: "Podatak5 vrijednost", name: podatak5_vrijednost, widget: string, required: false}
              - {label: "Program oznaka", name: program_oznaka, widget: string, required: false}
              - {label: "Program naslov", name: program_naslov, widget: text, required: false}
              - {label: "Program opis", name: program_opis, widget: text, required: false}
              - {label: "Podrucje1", name: podrucje1, widget: string, required: false}
              - {label: "Podrucje1 tekst", name: podrucje1_tekst, widget: text, required: false}
              - {label: "Podrucje2", name: podrucje2, widget: string, required: false}
              - {label: "Podrucje2 tekst", name: podrucje2_tekst, widget: text, required: false}
              - {label: "Podrucje3", name: podrucje3, widget: string, required: false}
              - {label: "Podrucje3 tekst", name: podrucje3_tekst, widget: text, required: false}
              - {label: "Podrucje4", name: podrucje4, widget: string, required: false}
              - {label: "Podrucje4 tekst", name: podrucje4_tekst, widget: text, required: false}
              - {label: "Misija oznaka", name: misija_oznaka, widget: string, required: false}
